name: Palomar mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full public commit SHA (leave blank for the selected branch)
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-commit:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      request_id: ${{ steps.resolve.outputs.request_id }}
    steps:
      - name: Validate the public snapshot
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.commit || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Provide a full lowercase 40-character commit SHA, or leave it blank."
            exit 1
          fi
          resolved=$(gh api "repos/$REPOSITORY/commits/$REQUESTED_COMMIT" --jq .sha)
          if [[ "$resolved" != "$REQUESTED_COMMIT" ]]; then
            echo "::error::The requested commit did not resolve to the exact public snapshot."
            exit 1
          fi
          echo "commit=$resolved" >> "$GITHUB_OUTPUT"
          request_id=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-12)
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve-commit
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ needs.resolve-commit.outputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.resolve-commit.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
