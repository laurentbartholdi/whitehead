version: "v0.4"
project:
  name: "Finite Chains of Two-Complexes and Acyclic Covers"
  description: >-
    Whitehead's asphericity problem would have a negative answer if a
    non-aspherical two-complex began an infinite chain whose inclusions induce
    zero maps on second homotopy groups. This Lean formalization proves the
    article's main finite-length characterization: a connected two-complex K
    begins such chains of every finite length if and only if K has a connected
    acyclic regular cover. It also formalizes the finite acyclic enhancement.
  authors:
    - "Laurent Bartholdi"
    - "Roman Mikhailov"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Laurent Bartholdi"
classification:
  arxiv:
    - math.GT
    - math.GR
  msc2020:
    - 55P15
sources:
  - title: "Finite Chains of Two-Complexes and Acyclic Covers"
    authors:
      - "Laurent Bartholdi"
      - "Roman Mikhailov"
    id: "arXiv:2610.10074"
    type: "paper"
    location: "Theorem A"
    relationship: "formalizes"
    note: >-
      https://arxiv.org/abs/2610.10074. Whitehead.TheoremA formalizes Theorem A:
      the equivalence between pi_2-trivial chains of every finite length and a
      connected regular acyclic cover, together with the finite acyclic
      enhancement. The arXiv abstract's explicit finite non-aspherical
      SL(2,5) presentation-complex consequence is outside the compared theorem.
    license: "unknown"
    author_endorsement: "participated"
related_formalizations: []
status:
  scope: >-
    Formalizes Theorem A as stated in Challenge.lean, including both directions
    of the arbitrary-chain characterization and the finite complex enhancement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "Whitehead.TheoremA"
