version: "v0.4"
project:
  name: "Finite Chains of Two-Complexes and Acyclic Covers"
  description: >-
    A Lean formalization of the main theorem of the article: given a two-dimensional
    CW complex K, there exists an arbitrarily long chain of inclusions K ⊂ K₁ ⊂ ... ⊂ Kₙ which are 0 on π₂ if and
    only if K admits a regular acyclic cover.
  authors:
    - "Laurent Bartholdi"
    - "Roman Mikhailov"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Laurent Bartholdi"
classification:
  arxiv:
    - math.AT
  msc2020:
    - 55P15
sources:
